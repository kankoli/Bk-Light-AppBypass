device:
  address: "3677CDED-A2E8-1829-8A02-69433100DA0C"
  auto_reconnect: true
  reconnect_delay: 2.0
  mtu: 2048
  timezone: auto
  scan_timeout: 6.0
       
panels:
  tile_width: 32
  tile_height: 32
  layout:
    columns: 2
    rows: 2
  list:
    - name: top_left
      address: "3677CDED-A2E8-1829-8A02-69433100DA0C"
      grid_x: 0
      grid_y: 0
      rotation: 180
    - name: top-right
      address: "B612AE06-0B30-5961-24AF-70E2A6B6D7AB"
      grid_x: 1
      grid_y: 0
      rotation: 180
    - name: bottom-left
      address: "BDC6B470-6315-8225-1CC9-BF8A0F0425F9"
      grid_x: 0
      grid_y: 1
    - name: bottom-right
      address: "66F8F473-472C-6EE4-4A33-4958E6FF0900"
      grid_x: 1
      grid_y: 1


display:
  frame_interval: 0.05
  max_retries: 3
  log_notifications: true
  antialias_text: false
  skip_stage_two_handshake: true
  log_ack_timings: true

runtime:
  mode: clock
  preset: default
  options:
    timezone: "Europe/Paris"
    
presets:
  clock:
    default:
      format: 24h
      theme: dark
      color: "#E2E8FF"
      accent: "#6E7DFF"
      background: "#000000"
      font: "aldopc"
      interval: 0.5
      dot_flashing: true
      dot_flash_period: 1.0
  text:
    default:
      color: "#FF0000"
      background: "#000000"
      font: null
      size: 18
      spacing: 1
      mode: static
      direction: left
      speed: 24.0
      gap: 32
      offset_x: 0
      offset_y: 0
      interval: 0.05
    marquee_left:
      color: "#00FFAA"
      background: "#000000"
      mode: scroll
      direction: left
      speed: 30.0
      step: 3
      gap: 32
      size: 18
      spacing: 2
      offset_y: 0
      interval: 0.04
    marquee_right:
      color: "#FFFFFF"
      background: "#000000"
      mode: scroll
      direction: right
      speed: 20.0
      step: 2
      gap: 48
      size: 20
      spacing: 1
      offset_y: -2
      interval: 0.05
  image:
    default:
      mode: fit
      rotate: 0
      mirror: false
      invert: false
  counter:
    default:
      start: 0
      count: 10
      delay: 1.0
  game:
    default:
      fps: 20.0
      ble_delay: 0.05
      background: "#050505"
      player_color: "#00FFAA"
      trail_color: "#002626"
      controller: null
      state: bouncer
      font: null
      text_size: 20
      input_timeout: 0.02
    counter_demo:
      fps: 15.0
      ble_delay: 0.01
      background: "#010101"
      player_color: "#F4F7FF"
      trail_color: null
      controller: "bk_light.controllers.keyboard:KeyboardController"
      state: counter
      font: "Aldo PC"
      text_size: 24
      input_timeout: 0.02
